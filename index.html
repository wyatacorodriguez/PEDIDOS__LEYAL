<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - LEYAL SPORT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Registrar Nuevo Pedido</h1>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="client">Cliente:</label>
                <input type="text" id="client" required placeholder="Nombre del cliente">
            </div>

            <div class="form-group">
                <label for="fabric">Tela / Calidad:</label>
                <select id="fabric">
                    <option value="PREMIUM">PREMIUM</option>
                    <option value="ECONOMICO">ECONOMICO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Modelo:</label>
                <input type="text" id="model" required placeholder="Modelo / Diseño">
            </div>

            <div class="form-group">
                <label for="seller">Registra:</label>
                <select id="seller">
                    <option value="WILLIAN">WILLIAN</option>
                    <option value="MARLENE">MARLENE</option>
                </select>
            </div>

            <!-- DOS CAMPOS DE IMAGEN -->
            <div class="form-group">
                <label for="imageFile1">Foto 1 (Captura/Pedido):</label>
                <input type="file" id="imageFile1" accept="image/*">
            </div>

            <div class="form-group">
                <label for="imageFile2">Foto 2 (Diseño/Lista de Tallas):</label>
                <input type="file" id="imageFile2" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">Guardar Pedido</button>
        </form>

        <h2>Trabajos Activos</h2>
        <table>
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Cliente</th>
                    <th>Tela / Calidad</th>
                    <th>Modelo</th>
                    <th>Registra</th>
                    <th>Estado</th>
                    <th>Detalle</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="activeOrders"></tbody>
        </table>

        <h2>Trabajos Finalizados</h2>
        <table>
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Cliente</th>
                    <th>Tela / Calidad</th>
                    <th>Modelo</th>
                    <th>Registra</th>
                    <th>Estado</th>
                    <th>Detalle</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="completedOrders"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
